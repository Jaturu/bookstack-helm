suite: chart-managed secrets
templates:
  - secrets.yaml
release:
  name: wiki
set:
  bookstack.appUrl: https://wiki.example.com
tests:
  - it: creates the APP_KEY and MariaDB Secrets by default
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: metadata.name, value: wiki-bookstack-app-key }
        documentIndex: 0
      - equal: { path: metadata.name, value: wiki-bookstack-mariadb }
        documentIndex: 1

  - it: keeps both Secrets on uninstall
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/resource-policy"]'
          value: keep

  - it: generates APP_KEY in Laravel's base64 format
    documentIndex: 0
    asserts:
      - exists: { path: data.APP_KEY }
      # "base64:" + base64 of 32 bytes (44 chars)
      - matchRegex:
          path: data.APP_KEY
          decodeBase64: true
          pattern: '^base64:[A-Za-z0-9+/]{43}=$'

  - it: generates both MariaDB passwords
    documentIndex: 1
    asserts:
      - exists: { path: 'data["mariadb-password"]' }
      - exists: { path: 'data["mariadb-root-password"]' }

  - it: reuses existing values on upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: v1, resource: secrets }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: wiki-bookstack-app-key, namespace: NAMESPACE }
          data: { APP_KEY: S0VFUA== }
        - kind: Secret
          apiVersion: v1
          metadata: { name: wiki-bookstack-mariadb, namespace: NAMESPACE }
          data: { mariadb-password: VVNFUg==, mariadb-root-password: Uk9PVA== }
    asserts:
      - equal: { path: data.APP_KEY, value: S0VFUA== }
        documentIndex: 0
      - equal: { path: 'data["mariadb-password"]', value: VVNFUg== }
        documentIndex: 1
      - equal: { path: 'data["mariadb-root-password"]', value: Uk9PVA== }
        documentIndex: 1

  - it: creates no APP_KEY Secret when an existing one is given
    set:
      bookstack.appKey.existingSecret: my-key
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: wiki-bookstack-mariadb }

  - it: creates no MariaDB Secret when MariaDB is disabled
    set:
      mariadb.enabled: false
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: wiki-bookstack-app-key }

  - it: creates no MariaDB Secret when an existing one is given
    set:
      mariadb.auth.existingSecret: my-db
    asserts:
      - hasDocuments: { count: 1 }
