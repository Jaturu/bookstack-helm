apiVersion: v2
name: bookstack
description: >-
  BookStack wiki on a non-root php-fpm image with an nginx-unprivileged sidecar,
  optional built-in MariaDB (official image), and Gateway API HTTPRoute support.
type: application

# Chart version (SemVer) – bump on every chart change.
version: 0.1.1

# BookStack release the chart is built and tested against. The default image
# tag is this value, and the image build in image/ uses the same version.
appVersion: "v26.09.2"

kubeVersion: ">=1.29.0-0"

home: https://github.com/Jaturu/bookstack-helm
sources:
  - https://github.com/Jaturu/bookstack-helm
  - https://codeberg.org/bookstack/bookstack
maintainers:
  - name: Jaturu
    url: https://github.com/Jaturu
keywords:
  - bookstack
  - wiki
  - documentation
  - knowledge-base
