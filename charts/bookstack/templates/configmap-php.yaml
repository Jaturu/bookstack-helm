{{- /*
  PHP settings generated by the chart. Mounted at /etc/bookstack/php.d, which
  the image scans after its own conf.d, so these override the image defaults.
*/ -}}
{{- $n := int .Values.bookstack.uploadLimitMB }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bookstack.fullname" . }}-php
  labels:
    {{- include "bookstack.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
data:
  zz-chart.ini: |
    ; Generated by the bookstack Helm chart – do not edit in the pod.
    ; Upload limits derived from bookstack.uploadLimitMB ({{ $n }} MB).
    upload_max_filesize = {{ $n }}M
    post_max_size       = {{ add $n 5 }}M
    {{- with .Values.php.extraIni }}

    ; php.extraIni
    {{- . | nindent 4 }}
    {{- end }}
