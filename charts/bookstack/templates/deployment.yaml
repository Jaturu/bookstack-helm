{{- include "bookstack.validate" . }}
{{- $fullname := include "bookstack.fullname" . }}
{{- $appImage := include "bookstack.imageRef" (dict "image" .Values.image "default" .Chart.AppVersion) }}
{{- $b := .Values.bookstack }}
{{- $useS3 := has "s3" (list $b.storageType $b.storageImageType $b.storageAttachmentType) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "bookstack.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
spec:
  replicas: 1
  # RWO volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bookstack.selectorLabels" (dict "ctx" $ "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bookstack.podLabels" (dict "ctx" $ "component" "app") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        checksum/php: {{ include (print $.Template.BasePath "/configmap-php.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      initContainers:
        # Prepare writable paths under a read-only root filesystem:
        #  - public/ assets -> emptyDir served by nginx
        #  - bootstrap/cache -> emptyDir (Laravel compiled config/services)
        #  - storage/ skeleton (framework/cache, sessions, views, logs, uploads)
        #    -> PVC, copied without overwriting, so a new empty volume works and
        #    existing data is never touched.
        # cp -R, not -a: the volume roots are root-owned mount points, so a
        # non-root cp cannot preserve timestamps/ownership on them.
        # The storage seeding uses find + test instead of cp's no-overwrite
        # flags: GNU --update=none is missing from BusyBox, and -n behaves
        # differently between coreutils releases.
        - name: copy-assets
          image: {{ $appImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - >-
              cp -R /var/www/bookstack/public/. /public/ &&
              cp -R /var/www/bookstack/bootstrap/cache/. /bootstrap-cache/ &&
              cd /var/www/bookstack/storage &&
              find . -type d -exec sh -c 'for d; do mkdir -p "/storage/$d" || exit 1; done' sh {} + &&
              find . -type f -exec sh -c 'for f; do [ -e "/storage/$f" ] || cp "$f" "/storage/$f" || exit 1; done' sh {} +
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          volumeMounts:
            - { name: public, mountPath: /public }
            - { name: bootstrap-cache, mountPath: /bootstrap-cache }
            - { name: data, mountPath: /storage, subPath: storage }
        {{- if .Values.migrations.enabled }}
        {{- with .Values.migrations.waitForDatabase }}
        {{- if .enabled }}
        # Block until the database accepts a login. On a first install MariaDB
        # spends a minute initialising; without this, migrate fails and the
        # pod restarts until it is ready. Bad credentials fail at once.
        - name: wait-for-database
          image: {{ $appImage }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - php
            - -r
            - |
              {{- $.Files.Get "files/wait-for-database.php" | trimPrefix "<?php\n" | nindent 14 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources.app | nindent 12 }}
          {{- include "bookstack.appEnv" (dict "ctx" $ "useS3" false) | nindent 10 }}
            - name: WAIT_TIMEOUT
              value: {{ .timeoutSeconds | int | quote }}
        {{- end }}
        {{- end }}
        # Apply schema migrations before php-fpm starts.
        - name: migrate
          image: {{ $appImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          {{- include "bookstack.appEnv" (dict "ctx" $ "useS3" $useS3) | nindent 10 }}
          {{- include "bookstack.appMounts" . | nindent 10 }}
        {{- end }}

      containers:
        - name: bookstack
          image: {{ $appImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          {{- include "bookstack.appEnv" (dict "ctx" $ "useS3" $useS3) | nindent 10 }}
          {{- include "bookstack.appMounts" . | nindent 10 }}
          # php-fpm has no network listener outside the pod; liveness reaches
          # it through nginx's health server (same network namespace).
          livenessProbe:
            httpGet:
              path: /fpm-ping
              # Numeric: named ports resolve only within the probing container,
              # and "health" is declared on the nginx container.
              port: {{ .Values.probes.healthPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

        - name: nginx
          image: {{ include "bookstack.imageRef" (dict "image" .Values.nginx.image "default" "") }}
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.nginx.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.probes.healthPort }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # BookStack's /status checks the database, cache and session store.
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - { name: public, mountPath: /var/www/bookstack/public, readOnly: true }
            - { name: data, mountPath: /var/www/bookstack/public/uploads, subPath: public-uploads, readOnly: true }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: nginx-tmp, mountPath: /tmp }

      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bookstack.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: public
          emptyDir: {}
        - name: bootstrap-cache
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: {{ $fullname }}-nginx
        - name: php-conf
          configMap:
            name: {{ $fullname }}-php

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
