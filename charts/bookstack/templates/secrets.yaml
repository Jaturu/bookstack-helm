{{- /*
  Chart-managed Secrets. Values are generated on first install, reused on
  upgrades (lookup), and the Secrets are kept on uninstall so APP_KEY and the
  database passwords are never lost by accident.
*/ -}}
{{- if not .Values.bookstack.appKey.existingSecret }}
{{- $name := include "bookstack.appKeySecretName" . }}
{{- $key := .Values.bookstack.appKey.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $value = index $existing.data $key }}
{{- else }}
{{- $value = printf "base64:%s" (randAlphaNum 32 | b64enc) | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bookstack.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
{{- if and .Values.mariadb.enabled (not .Values.mariadb.auth.existingSecret) }}
{{- $name := include "bookstack.mariadb.secretName" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bookstack.labels" (dict "ctx" $ "component" "mariadb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.mariadb.auth.passwordKey }}: {{ include "bookstack.secretValue" (dict "ctx" $ "name" $name "key" .Values.mariadb.auth.passwordKey "length" 32) }}
  {{ .Values.mariadb.auth.rootPasswordKey }}: {{ include "bookstack.secretValue" (dict "ctx" $ "name" $name "key" .Values.mariadb.auth.rootPasswordKey "length" 32) }}
{{- end }}
