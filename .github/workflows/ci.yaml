# Pull-request and main-branch checks: the same layers as `make test-all`,
# plus the vulnerability gates the release applies.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Generated by the rescan workflow, and no code depends on it.
    paths-ignore: [docs/security-status.md, docs/security-status.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.1
  HELM_UNITTEST_VERSION: v1.0.3
  HELM_DOCS_VERSION: 1.14.2
  KUBECONFORM_VERSION: v0.8.0
  HADOLINT_VERSION: v2.15.1
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  SYFT_VERSION: v1.49.0
  # Trivy and Grype with their databases, rebuilt nightly.
  SCANNERS_IMAGE: ghcr.io/jaturu/scanners:slim

jobs:
  # ------------------------------------------------------------------ lint
  lint:
    name: shellcheck, hadolint, scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # shellcheck ships on the runner image. Info/style findings are left
      # out: the tests quote container-side expansions on purpose.
      - name: shellcheck
        run: shellcheck --version | head -2 && shellcheck -S warning tests/*.sh scripts/*.sh

      # A checksum-pinned binary rather than a third-party action.
      - name: hadolint
        run: |
          curl -fsSLo hadolint "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint && ./hadolint image/Dockerfile

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install test tooling
        run: python -m pip install --quiet --require-hashes -r requirements-dev.txt

      - name: ruff
        run: ruff check scripts tests/scripts

      - name: Report script tests
        run: pytest -q

  # ----------------------------------------------------------------- chart
  chart:
    name: lint, unit, schema, docs, misconfig
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # ct lint compares against the target branch

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install test tools
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" --verify=false
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin helm-docs

      - name: Lint
        run: make lint

      - name: Template unit tests
        run: make test-unit

      - name: Schema validation
        run: make test-schema

      - name: Chart README is up to date
        run: make docs-check

      - name: Pull the scanners image
        run: |
          docker pull --quiet "$SCANNERS_IMAGE"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$SCANNERS_IMAGE")"
          echo "SCANNERS_REF=${ref}" >> "$GITHUB_ENV"
          SCANNERS_REF="$ref" scripts/scan.sh sh -c 'trivy --version && grype version'

      # Renders the Helm chart and checks it, the Dockerfile and the workflows
      # for misconfiguration, and the whole tree for committed secrets.
      - name: Trivy source scan (secrets and misconfig)
        run: scripts/scan.sh trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

      - name: ct lint (version bump, Chart.yaml schema, yamllint)
        if: github.event_name == 'pull_request'
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510  # v2.9.0
      - if: github.event_name == 'pull_request'
        run: ct lint --config ct.yaml --target-branch "${{ github.base_ref }}"

  # ----------------------------------------------------------------- image
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read BookStack version from Chart.yaml
        id: v
        run: echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build (native ${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: image
          build-args: BOOKSTACK_VERSION=${{ steps.v.outputs.version }}
          tags: bookstack:dev
          load: true
          provenance: false
          cache-from: type=gha,scope=linux/${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux/${{ matrix.arch }}

      - name: Image contract tests
        run: IMAGE=bookstack:dev tests/image-test.sh

      # --- The release gates, applied before merge ---

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: bookstack:dev
          format: cyclonedx-json@1.5
          output-file: sbom.cyclonedx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false

      - name: Pull the scanners image
        run: |
          docker pull --quiet "$SCANNERS_IMAGE"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$SCANNERS_IMAGE")"
          echo "SCANNERS_REF=${ref}" >> "$GITHUB_ENV"
          SCANNERS_REF="$ref" scripts/scan.sh sh -c 'trivy --version && grype version'

      # Same policy as the release: block only on findings with a fix.
      - name: Grype gate (fixable only)
        run: |
          scripts/scan.sh grype sbom:sbom.cyclonedx.json --config .grype-ignore.yaml \
            --only-fixed --fail-on high --output table

      # The scanners container has no Docker daemon, so it reads a saved copy.
      - name: Trivy gate (fixable only)
        run: |
          docker save bookstack:dev -o bookstack-dev.tar
          scripts/scan.sh trivy image --input bookstack-dev.tar --format table \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
