name: rescan

# Re-scans the SBOM already attached to the published image and rewrites
# docs/security-status.md. No rebuild and no image pull: the CycloneDX SBOM
# published with the release is the input, so this answers whether the current
# release is safe to run today. See docs/supply-chain.md.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jaturu/bookstack
  TRIVY_VERSION: v0.72.0
  GRYPE_VERSION: v0.116.0
  CRANE_VERSION: v0.21.7
  ORAS_VERSION: 1.3.3

jobs:
  scan-platform:
    name: rescan ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive platform slug
        run: echo "SLUG=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7
        with:
          version: ${{ env.CRANE_VERSION }}

      - name: Install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Pull the published SBOM for this platform
        run: |
          digest="$(crane digest --platform '${{ matrix.platform }}' "${IMAGE}:latest")"
          # A rebuild that reproduces the same platform digest (a forced or
          # mode-only rebuild) attaches a second SBOM to it. They describe the
          # same image, so take the newest by its creation annotation.
          referrer="$(oras discover --format json "${IMAGE}@${digest}" \
            | jq -r '[.referrers[]
                | select(.artifactType=="application/vnd.cyclonedx+json")]
                | sort_by(.annotations["org.opencontainers.image.created"] // "")
                | last | .digest // empty')"
          [ -n "$referrer" ] || { echo "no SBOM referrer on ${IMAGE}@${digest}" >&2; exit 1; }
          oras pull -o . "${IMAGE}@${referrer}"
          echo "PLATFORM_DIGEST=${digest}" >> "$GITHUB_ENV"

      # Report only. A finding must reach the page rather than kill the run,
      # and the verdict step below is what turns a real one red.
      - name: Grype re-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          sbom: sbom.cyclonedx.${{ env.SLUG }}.json
          config: .grype-ignore.yaml
          output-format: json
          output-file: grype-report.${{ env.SLUG }}.json
          severity-cutoff: high
          grype-version: ${{ env.GRYPE_VERSION }}
          fail-build: false
          cache-db: true

      - name: Trivy re-scan
        run: |
          trivy sbom --format json \
            --output "trivy-report.${SLUG}.json" \
            "sbom.cyclonedx.${SLUG}.json"

      - name: Record the platform digest
        run: |
          mkdir -p out
          echo "${SLUG}=${PLATFORM_DIGEST}" > "out/${SLUG}.platform"
          cp "sbom.cyclonedx.${SLUG}.json" "grype-report.${SLUG}.json" \
             "trivy-report.${SLUG}.json" out/

      - name: Upload re-scan reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rescan-${{ env.SLUG }}
          path: out/*
          if-no-files-found: error

  publish:
    name: rewrite the status page
    needs: [scan-platform]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7
        with:
          version: ${{ env.CRANE_VERSION }}

      - name: Download re-scan reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/rescan
          pattern: rescan-*
          merge-multiple: true

      - name: Identify the current release
        run: |
          index="$(crane digest "${IMAGE}:latest")"
          gittag="$(git tag -l 'image-*' --sort=-v:refname | head -n1)"
          [ -n "$gittag" ] || { echo "no image release tag found" >&2; exit 1; }
          tag="${gittag#image-}"
          # latest and the newest release must be the same image, or the page
          # would describe a release nobody is running.
          if [ "$(crane digest "${IMAGE}:${tag}")" != "$index" ]; then
            echo "${IMAGE}:latest is not ${tag}" >&2
            exit 1
          fi
          echo "INDEX=${index}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Rewrite the status page
        run: |
          set --
          for f in /tmp/rescan/*.platform; do
            set -- "$@" --platform "$(cat "$f")"
          done
          expected="$(find /tmp/rescan -name '*.platform' | wc -l | tr -d ' ')"
          python3 -m scripts.rescan_status \
            --image "$IMAGE" --tag "$TAG" --index-digest "$INDEX" \
            --reports-dir /tmp/rescan "$@" \
            --expect-platforms "$expected" \
            --output docs/security-status.md \
            --badge docs/security-status.json

      - name: Commit the page when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first. git diff compares tracked files only, so on the run
          # that creates the page it reports no change and skips the commit.
          git add docs/security-status.md docs/security-status.json
          if git diff --cached --quiet -- docs/security-status.md docs/security-status.json; then
            echo "No change since the last re-scan."
            exit 0
          fi
          git commit -m "Update security status for ${TAG}"
          git push

      # Last, so the page is already committed when the run goes red.
      - name: Fail on a fixable High or Critical finding
        run: |
          if grep -q '^Action needed' docs/security-status.md; then
            head -n3 docs/security-status.md >&2
            exit 1
          fi
          echo "No fixable High or Critical findings against ${TAG}."
