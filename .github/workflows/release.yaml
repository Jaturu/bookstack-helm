name: release

# Image: each arch builds natively and is pushed by digest only, then scanned
# (Syft SBOM, Grype + Trivy gates). Only if every platform passes does publish
# merge the manifest, sign it keyless (recursively), claim the build number,
# and promote it to <appVersion>-<build>, <appVersion> and latest, with the
# SBOM and scan reports attached and a release report on GitHub.
# Chart: GitHub release + gh-pages index, and OCI (signed). A chart version
# that is already published is skipped, so only a version bump releases one.
# Same shape as Jaturu/omada-release-watch; see docs/supply-chain.md.
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "image/**"
      - ".grype-ignore.yaml"
  workflow_dispatch:
    inputs:
      force-image:
        description: Rebuild the image even if image/ is unchanged (picks up Debian security updates)
        type: boolean
        default: false

# Least privilege at the top, widened only on the jobs that publish.
permissions:
  contents: read

concurrency:
  group: release
  # Never cancel a release mid-flight.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jaturu/bookstack
  CHART_REPO: oci://ghcr.io/jaturu/charts
  HELM_VERSION: v4.3.1
  TRIVY_VERSION: v0.72.0
  GRYPE_VERSION: v0.116.0
  SYFT_VERSION: v1.49.0
  COSIGN_VERSION: v3.1.2
  CRANE_VERSION: v0.21.7
  ORAS_VERSION: 1.3.3

jobs:
  # ------------------------------------------------------- what to publish
  plan:
    runs-on: ubuntu-24.04
    outputs:
      app-version: ${{ steps.v.outputs.app }}
      build-image: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.force-image }}
        run: |
          app=$(make -s version)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          build=false
          # Rebuild when forced, when the image inputs or appVersion changed,
          # or when the tag does not exist in the registry yet.
          if [ "$FORCE" = "true" ]; then
            build=true
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            build=true
          elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- image/ .grype-ignore.yaml; then
            build=true
          elif git diff "$BEFORE" "$GITHUB_SHA" -- charts/bookstack/Chart.yaml | grep -q '^[-+]appVersion:'; then
            build=true
          elif ! docker buildx imagetools inspect "$IMAGE:$app" >/dev/null 2>&1; then
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "BookStack $app - build image: $build" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------- image: build and scan, per platform
  build-platform:
    name: build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.build-image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # packages: push the untagged per-platform image by digest.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive platform slug
        run: |
          slug="${{ matrix.platform }}"
          echo "SLUG=${slug//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: GHCR login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: image
          platforms: ${{ matrix.platform }}
          build-args: BOOKSTACK_VERSION=${{ needs.plan.outputs.app-version }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Attestations make the pushed object a per-platform index. Everything
      # that addresses the image itself needs the manifest inside it.
      - name: Resolve image manifest digest
        run: |
          img="$(docker buildx imagetools inspect --raw \
            "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" \
            | jq -r '.manifests[]
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | .digest')"
          case "$(printf '%s' "$img" | wc -w)" in
            1) ;;
            *) echo "expected one image manifest, got: ${img}" >&2; exit 1;;
          esac
          echo "IMAGE_DIGEST=${img}" >> "$GITHUB_ENV"
          echo "Index pushed:   ${{ steps.build.outputs.digest }}"
          echo "Image manifest: ${img}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Trivy cache key (daily)
        id: tcache
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.arch }}-${{ steps.tcache.outputs.day }}
          restore-keys: trivy-db-${{ runner.arch }}-

      # --- SBOM (Syft), scanned natively on this arch ---

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ env.IMAGE_DIGEST }}
          format: cyclonedx-json@1.5
          output-file: sbom.cyclonedx.${{ env.SLUG }}.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - name: Display SBOM summary
        run: |
          echo "Components: $(jq '.components | length' "sbom.cyclonedx.${SLUG}.json")"
          jq -r '.components[] | "\(.name) \(.version)"' "sbom.cyclonedx.${SLUG}.json" | sort

      # --- Vulnerability scans (Grype + Trivy) ---

      # The gates block only on findings with a fix to move to. Debian's
      # won't-fix and not-yet-fixed findings are recorded in the full
      # reports and on the status page, but cannot be acted on.
      # The report pass runs Grype directly: scan-action annotates every run
      # whose findings exceed its cutoff as a warning, even with fail-build
      # off, which would flag every release while Debian has unfixed CVEs.
      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Grype vulnerability scan (full report)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" "sbom:sbom.cyclonedx.${SLUG}.json" --config .grype-ignore.yaml \
            --output json --file "grype-report.${SLUG}.json"

      - name: Grype vulnerability scan (blocking gate, fixable only)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          sbom: sbom.cyclonedx.${{ env.SLUG }}.json
          config: .grype-ignore.yaml
          output-format: table
          severity-cutoff: high
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          fail-build: true
          cache-db: true

      - name: Trivy image scan (full report)
        run: |
          trivy image --format json --output "trivy-report.${SLUG}.json" \
            "${{ env.IMAGE }}@${IMAGE_DIGEST}"

      - name: Trivy image scan (blocking gate, fixable only)
        run: |
          trivy image --format table --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "${{ env.IMAGE }}@${IMAGE_DIGEST}"

      # --- Attach to this platform's digest, where tooling looks ---

      - name: Install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Attach SBOM and scan reports
        run: |
          oras attach --artifact-type application/vnd.cyclonedx+json \
            "${{ env.IMAGE }}@${IMAGE_DIGEST}" \
            "sbom.cyclonedx.${SLUG}.json:application/vnd.cyclonedx+json"
          oras attach --artifact-type application/vnd.security.vulnerability-report+json \
            "${{ env.IMAGE }}@${IMAGE_DIGEST}" \
            "grype-report.${SLUG}.json:application/vnd.security.vulnerability-report+json" \
            "trivy-report.${SLUG}.json:application/vnd.security.vulnerability-report+json"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ env.SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # always(): a failed gate must still leave its report to inspect.
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reports-${{ env.SLUG }}
          path: |
            sbom.cyclonedx.${{ env.SLUG }}.json
            grype-report.${{ env.SLUG }}.json
            trivy-report.${{ env.SLUG }}.json
          if-no-files-found: warn
          retention-days: 1

  # ------------------------------- image: assemble, sign, promote, report
  publish-image:
    name: assemble and publish image
    needs: [plan, build-platform]
    runs-on: ubuntu-24.04
    # contents: release git tag + GitHub release. packages: tags and
    # signatures. id-token + attestations: keyless signing, provenance.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute release tag (<appVersion>-<build>)
        id: rel
        env:
          APP: ${{ needs.plan.outputs.app-version }}
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true
          num=1
          for t in $(git tag -l "image-${APP}-*"); do
            suffix="${t#"image-${APP}-"}"
            case "$suffix" in ''|*[!0-9]*) continue;; esac
            [ "$suffix" -ge "$num" ] && num=$((suffix + 1))
          done
          echo "tag=${APP}-${num}" >> "$GITHUB_OUTPUT"
          echo "Computed release tag: ${APP}-${num}"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download scan reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/reports
          pattern: reports-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: GHCR login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-platform digests into staging tag (sha-<commit>)
        id: manifest
        working-directory: /tmp/digests
        run: |
          staging="${IMAGE}:sha-${GITHUB_SHA::7}"
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$staging" \
            $(printf "${IMAGE}@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "$staging" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: ${digest}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Trivy cache key (daily)
        id: tcache
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.arch }}-${{ steps.tcache.outputs.day }}
          restore-keys: trivy-db-${{ runner.arch }}-

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7
        with:
          version: ${{ env.CRANE_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Trivy source scan (secrets and misconfig, incl. the chart)
        run: trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

      # Digest-scoped work runs first. Nothing below publishes a release tag
      # until the build number is claimed, so a failure here is safe to retry.

      # --recursive: automation resolves the platform digest, and a signature
      # on the index alone is invisible to it.
      - name: Sign image (keyless, recursive)
        run: cosign sign --yes --recursive "${IMAGE}@${{ steps.manifest.outputs.digest }}"

      # cosign 3 signs to an OCI referrer the registry needs a moment to serve.
      - name: Verify image signature
        timeout-minutes: 3
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          sleep 5
          until cosign verify \
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/\.github/workflows/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.manifest.outputs.digest }}"; do
            sleep 5
          done

      - name: Build provenance attestation (GitHub)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      # --- Publishing starts here. Everything below writes a tag. ---

      # Claim the build number before publishing anything: a failure after
      # this leaves a git tag with no image, which is inert. Claiming it last
      # lets a failure strand an untagged image and blocks every retry.
      - name: Claim the release number
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "image-${TAG}" -m "Image release ${TAG}"
          git push origin "image-${TAG}"

      - name: Promote staging digest to release tags
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          APP: ${{ needs.plan.outputs.app-version }}
        run: |
          # <appVersion>-<build> is immutable. Only a genuine not-found counts
          # as absent; a rate limit, 5xx or DNS failure stops the release.
          if err="$(crane digest "${IMAGE}:${TAG}" 2>&1 >/dev/null)"; then
            echo "Release tag ${TAG} already exists on the registry; refusing to overwrite." >&2
            exit 1
          elif ! printf '%s' "$err" | grep -qiE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|not found|404'; then
            echo "Could not establish whether ${TAG} exists: ${err}" >&2
            exit 1
          fi
          crane tag "${IMAGE}@${{ steps.manifest.outputs.digest }}" "${TAG}"
          # <appVersion> moves to each rebuild of the same BookStack release;
          # it is the chart's default tag.
          crane tag "${IMAGE}@${{ steps.manifest.outputs.digest }}" "${APP}"
          crane tag "${IMAGE}@${{ steps.manifest.outputs.digest }}" latest
          echo "Image: \`${IMAGE}:${TAG}\` (also \`${APP}\`, \`latest\`) = \`${{ steps.manifest.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      # The readable copy of what the gates saw. Run artifacts expire in a day.
      # Non-blocking: the release is already promoted and signed by here.
      - name: Publish the release report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          INDEX: ${{ steps.manifest.outputs.digest }}
        run: |
          set --
          for f in /tmp/reports/sbom.cyclonedx.*.json; do
            slug="$(basename "$f" .json)"; slug="${slug#sbom.cyclonedx.}"
            digest="$(crane digest --platform "${slug/-//}" "${IMAGE}@${INDEX}")"
            set -- "$@" --platform "${slug}=${digest}"
          done
          expected="$(find /tmp/digests -type f | wc -l | tr -d ' ')"
          python3 -m scripts.render_release_report \
            --tag "$TAG" --index-digest "$INDEX" \
            --reports-dir /tmp/reports "$@" \
            --expect-platforms "$expected" \
            --output /tmp/release-body.md
          # --latest=false: "Latest release" stays with the chart releases.
          gh release create "image-${TAG}" --title "Image ${TAG}" --latest=false \
            --notes-file /tmp/release-body.md /tmp/reports/*.json

  # ------------------------------------------------------------------ chart
  chart:
    needs: [plan, publish-image]
    # Run when the image was published, or when no image build was needed.
    if: always() && needs.plan.result == 'success' && (needs.publish-image.result == 'success' || needs.publish-image.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # GitHub release + gh-pages
      packages: write       # OCI chart
      id-token: write       # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Release to GitHub + gh-pages index
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
          pages_branch: gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to OCI (if this version is new)
        id: oci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk '/^version:/ {print $2}' charts/bookstack/Chart.yaml)
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if helm show chart "$CHART_REPO/bookstack" --version "$version" >/dev/null 2>&1; then
            echo "Chart $version already in OCI registry - skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          helm package charts/bookstack -d dist
          out=$(helm push "dist/bookstack-$version.tgz" "$CHART_REPO" 2>&1); echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/ {print $2}')
          [ -n "$digest" ] || { echo "no digest in helm push output" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Chart: \`${CHART_REPO#oci://}/bookstack:$version\` = \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        if: steps.oci.outputs.digest != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign OCI chart (keyless)
        if: steps.oci.outputs.digest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "${CHART_REPO#oci://}/bookstack@${{ steps.oci.outputs.digest }}"
