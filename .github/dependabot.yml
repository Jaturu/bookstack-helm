version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images in image/Dockerfile (debian:<suite>-slim, composer:2).
  - package-ecosystem: "docker"
    directory: "/image"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Test tooling for scripts/ (pytest, ruff).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
