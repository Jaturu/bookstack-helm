; BookStack PHP settings.
; Installed as /etc/php84/conf.d/99-bookstack.ini, which Alpine's php-fpm and
; CLI both read, so php-fpm and `php artisan` behave the same.

; Uploads – keep in step with BookStack's FILE_UPLOAD_SIZE_LIMIT (MB, default 50)
; and nginx client_max_body_size in the chart.
upload_max_filesize = 50M
post_max_size       = 55M
memory_limit        = 256M
max_execution_time  = 120

expose_php    = Off
date.timezone = UTC

; Application code is immutable in the image, so skip file stat checks.
; A new image means a new pod and a fresh opcache.
opcache.enable                  = 1
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000
opcache.validate_timestamps     = 0
