; Complete php-fpm configuration for BookStack.
; Replaces Alpine's /etc/php84/php-fpm.conf; Alpine's php-fpm.d/www.conf is
; removed in the image, so this file is the single source of fpm settings.
; Runs as the container user (no user/group directives), foreground, no pid file.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
; FastCGI only on loopback – reachable by the nginx sidecar in the same pod,
; not from the pod network.
listen = 127.0.0.1:9000

pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests      = 500

; Health endpoints, exposed only through nginx on localhost for probes.
ping.path      = /fpm-ping
ping.response  = pong
pm.status_path = /fpm-status

; Pass container environment (DB_*, APP_KEY, ...) through to PHP.
clear_env = no

catch_workers_output    = yes
decorate_workers_output = no
